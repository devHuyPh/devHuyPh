name: Generate contribution snake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: devHuyPh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300D9F5&color_dots=%23EBEDF0,%23D3C6FA,%23AC91F0,%238963DB,%236B3CBE
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%237DF9FF&color_dots=%23151F32,%233D3267,%23634BA0,%239377DC,%23C4A7FF
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
