name: Generate contribution snake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: devHuyPh
          outputs: |
            dist/contribution-neon-light.svg?color_snake=%23009EB5&color_dots=%23E4EAF5,%23C7BBFA,%23A38AEE,%238068DD,%235C43BC
            dist/contribution-neon-dark.svg?palette=github-dark&color_snake=%237DF9FF&color_dots=%23364761,%236C60A5,%239B80D9,%23BEA0F4,%23E0CCFF
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
